[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rakesh", email = "ashlinsunil1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1; sys_platform != 'win32'",
    "ipykernel>=7.4.0",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-text-splitters",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
